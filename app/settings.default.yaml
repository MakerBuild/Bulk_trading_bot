mode: multi
single_master: 1

pool:
  max_groups: 5
  max_takers: 1

markets:
  - symbol: BTC-USD
    notional_usd: 100
    leverage: 10
    offset_bps: 2.0
    max_distance_bps: 5.0
    chase_patience_s: 3
    improve_ticks: 1
    join_depth_usd: 0
    time_in_force: ALO
    max_order_notional_usd: 100
    enabled: true

  - symbol: ETH-USD
    notional_usd: 100
    leverage: 10
    offset_bps: 3.0
    max_distance_bps: 8.0
    chase_patience_s: 3
    improve_ticks: 1
    max_order_notional_usd: 100
    enabled: true

hold_minutes: 0.5-1.5

execution_target:
  cycles: 0
  burn_usd: 3
  volume_usd: 0

risk:
  max_net_exposure_usd: 500.0
  max_position_usd: 5000.0
  max_reject_streak: 5
  max_hedge_impact_bps: 0
  ws_stale_timeout_s: 30.0
  price_stale_timeout_s: 15.0

max_phase_minutes: 30

pause:
  max_move_bps: 0
  window_minutes: 15
  calm_minutes: 10
  schedule: []

# Only for mode: delta-neutral (taker orders only). See README.
taking:
  max_slippage_bps: 2.0
  max_spread_bps: 3.0
  depth_fraction: 0.5
  slice_interval_s: 0.5

# Only for mode: auto-spread -- delta-neutral that sends every new group to
# the market with the narrowest spread at that moment. markets: tradfi
# (stocks, indices), crypto, or all. A market listed under markets: above
# keeps its own size there; any other trades notional_usd at leverage.
#
# tradfi: and crypto: are the tickers it may pick. Put # in front of one to
# skip it, add a line to trade a new listing. Delete a whole list to trade
# every market of that kind the exchange lists, new ones included.
auto_spread:
  markets: all
  notional_usd: 100
  leverage: 10
  tradfi:
    - CRCL
    - MSTR
    - MU
    - NVDA
    - SKHYNIX
    - SNDK
    - SPACEX
    - TSLA
    - US500
  crypto:
    - AAVE
    - BNB
    - BTC
    - DOGE
    - ENA
    - ETH
    - FARTCOIN
    - HYPE
    - JTO
    - JUP
    - LIT
    - MEGA
    - MON
    - NEAR
    - PAPER
    - PAXG
    - PUMP
    - SOL
    - SUI
    - TAO
    - XPL
    - XRP
    - ZEC

chase_interval_s: 1.0
reconcile_interval_s: 5.0
position_sync_interval_s: 60.0
hedge_tolerance_lots: 1.0
overlay_ttl_ms: 2000

max_margin_fraction: 0.25

state_file: "./app/state/strategy_state.json"
log_level: INFO
