mode: multi
single_master: 1

pool:
  max_groups: 5
  max_takers: 1

legs:
  master_account:
    symbol: BTC-USD
    notional_usd: 100
    leverage: 10
    offset_bps: 2.0
    max_distance_bps: 5.0
    chase_patience_s: 3
    improve_ticks: 1
    join_depth_usd: 0
    max_order_notional_usd: 100

  sub_account:
    symbol: ETH-USD
    notional_usd: 100
    leverage: 10
    offset_bps: 3.0
    max_distance_bps: 8.0
    chase_patience_s: 3
    improve_ticks: 1
    max_order_notional_usd: 100

hold_minutes: 0.5-1.5

execution_target:
  cycles: 0
  burn_usd: 3
  volume_usd: 0

risk:
  max_net_exposure_usd: 500.0
  max_position_usd: 5000.0
  max_reject_streak: 5
  max_hedge_impact_bps: 0
  ws_stale_timeout_s: 30.0
  price_stale_timeout_s: 15.0

max_phase_minutes: 30

chase_interval_s: 1.0
reconcile_interval_s: 5.0
position_sync_interval_s: 60.0
hedge_tolerance_lots: 1.0
overlay_ttl_ms: 2000

max_margin_fraction: 0.25

ws_ssl_auto_bypass: false
ws_insecure_ssl: false

state_file: "./app/state/strategy_state.json"
log_level: INFO
