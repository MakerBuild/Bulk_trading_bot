# pytest configuration. Lives here rather than in the project root so the
# root holds only what an operator touches. app/tests/run-tests.bat points at it.
#
# Given with -c, this file's own folder (app/dev) becomes the rootdir, and both
# paths below are resolved against it -- not against wherever pytest was started
# from. So `..` is app/, whichever of these was used:
#   app\.venv\Scripts\python -m pytest -c app\dev\pytest.ini app\tests   (from the root)
#   .venv\Scripts\python -m pytest -c dev\pytest.ini tests              (from app\)
[pytest]
asyncio_mode = auto
# The package is app/bulkdn, so app/ is what has to be importable. run-tests.bat
# also sets PYTHONPATH, but a bare pytest call should not depend on it.
pythonpath = ..
testpaths = ../tests
# Keeps .pytest_cache out of the project root. The suite is a few seconds, so
# the cache only buys --lf/--ff, which is not worth a directory.
addopts = -p no:cacheprovider
