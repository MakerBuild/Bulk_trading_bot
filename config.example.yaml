# Bulk delta-neutral bot configuration.
#
# The master private key is NEVER read from this file. Export it instead:
#   export BULK_PRIVATE_KEY=<base58 seed>
# The master pubkey is derived from that key. `sub1_pubkey` must be a
# sub-account of that master; the bot verifies this on startup and refuses
# to run if it isn't.

# MAINNET -- `run --live` here trades real funds. This also selects the
# signature domain byte (mainnet = 1, testnet = 2, devnet/staging = 3), so it
# must stay accurate: signing for the wrong network fails with `bad signature`.
# `testnet` (exchange-api / exchange-ws1) is live and fundable via the faucet,
# so a full cycle can be rehearsed there for free first.
network: mainnet          # mainnet | testnet | staging
sub1_pubkey: "REPLACE_WITH_SUB_ACCOUNT_PUBKEY"

# Endpoint overrides, for when the derived host is wrong.
# http_url: "https://mainnet-api1.bulk.trade/api/v1"
# ws_url: "wss://mainnet-ws1.bulk.trade"

# ---------------------------------------------------------------------------
# Strategy legs.
#
# OPEN:  master buys BTC (long), sub1 buys SOL (long).
#        Each fill is hedged with an opposite market order on the other account.
# EXIT:  sub1 buys back its BTC short, master buys back its SOL short,
#        both reduce-only. Each fill market-closes the counter-position.
# ---------------------------------------------------------------------------
#
# IMPORTANT -- minimum notional sets a floor on unhedged exposure.
# Live values: BTC-USD minNotional $1, SOL-USD minNotional $50.
# A hedge smaller than that floor cannot be submitted, so the pair can carry up
# to roughly one minNotional of directional exposure per symbol (~$50 on SOL)
# that no hedge can remove. `max_net_exposure_usd` must sit above that, and the
# leg should be large enough that this residual is a small share of it.
legs:
  btc:
    symbol: BTC-USD
    size: 0.001           # total base size to accumulate over the cycle
    offset_bps: 2.0       # rest this far inside the touch (2 bps below best bid)
    max_distance_bps: 5.0 # replace the order once it drifts this far from target
    max_order_size: 0.001 # cap on any single resting order
  sol:
    symbol: SOL-USD
    size: 2.0
    offset_bps: 3.0
    max_distance_bps: 8.0
    max_order_size: 2.0

# ---------------------------------------------------------------------------
# Timing
# ---------------------------------------------------------------------------
hold_minutes: 5.0         # how long to stay fully open before exiting
chase_interval_s: 1.0     # how often the chaser re-evaluates resting orders
reconcile_interval_s: 5.0 # how often positions are reconciled against truth
cycles: 1                 # number of full cycles to run; 0 = run forever

# ---------------------------------------------------------------------------
# Hedging
# ---------------------------------------------------------------------------
# A hedge fires when |net exposure| reaches this many lots. Below one lot the
# exchange cannot express the correction, so this should be >= 1.0.
hedge_tolerance_lots: 1.0
# How long an unconfirmed fill stays in the optimistic overlay before the bot
# falls back to exchange-reported positions. Covers the gap between a fill
# arriving and the matching position update.
overlay_ttl_ms: 2000

# ---------------------------------------------------------------------------
# Risk limits. Breaching any of these cancels all strategy orders, flattens
# both accounts, and halts the bot.
# ---------------------------------------------------------------------------
risk:
  max_net_exposure_usd: 500.0   # hard cap on uncorrected directional exposure
  max_position_usd: 5000.0      # per-account, per-symbol notional ceiling
  max_reject_streak: 5          # consecutive order rejections before halting
  ws_stale_timeout_s: 30.0      # no WS traffic for this long => halt
  price_stale_timeout_s: 15.0   # refuse to chase on a ticker older than this

state_file: "./state/strategy_state.json"
log_level: INFO
