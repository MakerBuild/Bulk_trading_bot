# Bulk delta-neutral bot configuration.
#
# This file is tracked in git and holds placeholders only. The master private
# key is NEVER read from it -- put the base58 seed on a single line in
# `private_key.local` (git-ignored), then encrypt it with
# `bulkdn encrypt-key`. Exporting BULK_PRIVATE_KEY skips the file entirely.
#
# The master pubkey is derived from that key. `sub1_pubkey` must be a
# sub-account of that master; the bot verifies this on startup and refuses
# to run if it isn't.

# This bot is MAINNET-ONLY -- `run --live` trades real funds. The endpoints and
# the signature domain byte are pinned in bulkdn/config.py; there is no network
# selector, and no rehearsal environment.
sub1_pubkey: "REPLACE_WITH_SUB_ACCOUNT_PUBKEY"

# Endpoint overrides, for when the published hosts change.
# http_url: "https://mainnet-api1.bulk.trade/api/v1"
# ws_url: "wss://mainnet-ws1.bulk.trade"

# TLS. The mainnet WebSocket currently serves an EXPIRED certificate while the
# HTTP host verifies cleanly, so verification would fail and the account stream
# would never open -- and a bot that cannot see its fills cannot hedge.
# `ws_ssl_auto_bypass` keeps verification on but retries once without it, which
# is why it defaults to true. Set it false to fail hard instead.
# `ws_insecure_ssl` skips verification outright; prefer the retry.
ws_ssl_auto_bypass: true
ws_insecure_ssl: false

# ---------------------------------------------------------------------------
# Strategy legs.
#
# OPEN:  master buys BTC (long), sub1 buys SOL (long).
#        Each fill is hedged with an opposite market order on the other account.
# EXIT:  sub1 buys back its BTC short, master buys back its SOL short,
#        both reduce-only. Each fill market-closes the counter-position.
# ---------------------------------------------------------------------------
#
# IMPORTANT -- minimum notional sets a floor on unhedged exposure.
# Live values: BTC-USD minNotional $1, SOL-USD minNotional $50.
# A hedge smaller than that floor cannot be submitted, so the pair can carry up
# to roughly one minNotional of directional exposure per symbol (~$50 on SOL)
# that no hedge can remove. `max_net_exposure_usd` must sit above that, and the
# leg should be large enough that this residual is a small share of it.
legs:
  btc:
    symbol: BTC-USD
    size: 0.001           # total base size to accumulate over the cycle
    offset_bps: 2.0       # rest this far inside the touch (2 bps below best bid)
    max_distance_bps: 5.0 # replace the order once it drifts this far from target
    max_order_size: 0.001 # cap on any single resting order
    # leverage: 10          # optional; omit to keep whatever the account has.
                            # Checked against the market's own maximum from
                            # /exchangeInfo before anything is sent.
  sol:
    symbol: SOL-USD
    size: 2.0
    offset_bps: 3.0
    max_distance_bps: 8.0
    max_order_size: 2.0

# ---------------------------------------------------------------------------
# Timing
# ---------------------------------------------------------------------------
hold_minutes: 5.0         # how long to stay fully open before exiting
chase_interval_s: 1.0     # how often the chaser re-evaluates resting orders
reconcile_interval_s: 5.0 # how often positions are reconciled against truth
# `cycles` now lives under execution_target at the end of this file.

# ---------------------------------------------------------------------------
# Hedging
# ---------------------------------------------------------------------------
# A hedge fires when |net exposure| reaches this many lots. Below one lot the
# exchange cannot express the correction, so this should be >= 1.0.
hedge_tolerance_lots: 1.0
# How long an unconfirmed fill stays in the optimistic overlay before the bot
# falls back to exchange-reported positions. Covers the gap between a fill
# arriving and the matching position update.
overlay_ttl_ms: 2000

# ---------------------------------------------------------------------------
# Risk limits. Breaching any of these cancels all strategy orders, flattens
# both accounts, and halts the bot.
# ---------------------------------------------------------------------------
risk:
  max_net_exposure_usd: 500.0   # hard cap on uncorrected directional exposure
  max_position_usd: 5000.0      # per-account, per-symbol notional ceiling
  max_reject_streak: 5

  # Refuse a hedge whose expected slippage, read off the market's published
  # impact curve (GET /impact), exceeds this. A hedge cannot be shrunk without
  # leaving the pair directional, so the choice is to pay or to stop.
  # 0 disables the check, which is also what happens for a market with no
  # curve published -- and at the time of writing no mainnet market has one.
  max_hedge_impact_bps: 0          # consecutive order rejections before halting
  ws_stale_timeout_s: 30.0      # no WS traffic for this long => halt
  price_stale_timeout_s: 15.0   # refuse to chase on a ticker older than this

state_file: "./state/strategy_state.json"
log_level: INFO

# Telegram notifications: run start, each cycle, halts, and the final summary.
# A halt cancels orders and flattens both accounts, so it is the one event
# worth knowing about immediately -- without this it only reaches the console.
# Leave bot_token empty to disable. Setting a token without user_ids is an
# error rather than a silent no-op.
telegram:
  bot_token: ""             # from @BotFather, looks like "12345:AAE..."
  user_ids: []              # e.g. [21957123] -- your numeric Telegram id

# Referral gating: run only for accounts that came in through you.
# Checked once at startup against BULK's public indexer, never mid-cycle --
# a gate that tripped mid-run would abandon open positions.
#
# Note this is a speed bump, not enforcement: it runs on the user's machine
# in source they can edit. It stops the bot being passed around casually.
#
# People arrive by two separate routes, and `wallets` covers BOTH: it is
# matched against referred_by_wallet AND access.invited_by_wallet. That one
# address admits everyone you referred (15) and everyone who redeemed one of
# your invites (32), and keeps working as invite codes are reissued weekly --
# which is why listing individual invite codes is not the way to do this.
#
# owner_wallets is not optional in practice: the check asks who referred a
# wallet, and a referrer was not referred by themselves -- so without it the
# gate refuses its own author. Your own wallets belong here.
access:
  require_referral: false   # flip to true for a build you hand out
  wallets:                  # matched against referrers AND inviters
    - "2xW5fXY766e9FbSen855Z8cPnJVWEsPorbShj7Hhhfd1"
  codes: ["MAKER"]          # referral code, matched case-insensitively
  invite_codes: []          # individual BULK-XXX-XXX codes; goes stale, prefer wallets
  owner_wallets:            # run unconditionally, no referral record needed
    - "BR4SV1CRKygGWCsb1zF3g38Xc68b31WkEagdk8hVedB8"  # trading master
    - "2xW5fXY766e9FbSen855Z8cPnJVWEsPorbShj7Hhhfd1"  # referral wallet
  allow_on_error: false     # true = run anyway if the indexer is unreachable

# Execution target: whichever limit is reached first ends the run.
# 0 disables a limit. burn_usd and volume_usd are measured from the
# exchange's own fill records, so they survive a restart.
execution_target:
  cycles: 0
  burn_usd: 100
  volume_usd: 0
