# pytest configuration. Lives here rather than in the project root so the
# root holds only what an operator touches. tests/run-tests.bat points at it.
[pytest]
asyncio_mode = auto
testpaths = tests
# Keeps .pytest_cache out of the project root. The suite is a few seconds, so
# the cache only buys --lf/--ff, which is not worth a directory.
addopts = -p no:cacheprovider
